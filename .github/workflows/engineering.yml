name: Engineering verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yahtzee:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix device/pi
      - run: node scripts/engineering-check.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: artifacts/engineering/
          if-no-files-found: warn
