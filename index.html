<!DOCTYPE html>
<html lang="en" data-design="playform">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b141c">
<style>html[data-booting] body{visibility:hidden}html[data-booting]{background:#0b141c}</style>
<title>Yahtzee — Clubhouse</title>
<script>
document.documentElement.dataset.booting = '';
try { document.documentElement.dataset.theme = localStorage.getItem('yz_theme') === 'dark' ? 'dark' : 'light'; }
catch { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<noscript>Enable JavaScript to play YAHTZ.</noscript>
<script type="module" src="/src/bootstrap.js"></script>
</body>
</html>
